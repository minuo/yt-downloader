<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>yt-downloader</title>
<style>
  :root {
    --bg: #0f1115;
    --card: #171a21;
    --line: #252a34;
    --text: #e8eaed;
    --muted: #8b93a1;
    --accent: #5b8cff;
    --ok: #35c46b;
    --err: #ff6b6b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 28px 20px 60px;
    background: var(--bg); color: var(--text);
    font: 14px/1.6 "Segoe UI", "Microsoft YaHei", sans-serif;
    display: flex; justify-content: center;
  }
  main { width: 100%; max-width: 780px; }
  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
  .brand { display: flex; align-items: center; gap: 9px; font-size: 17px; font-weight: 600; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 10px var(--ok); }
  .brand small { color: var(--muted); font-weight: 400; font-size: 12px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
  textarea, input {
    width: 100%; background: #10131a; color: var(--text);
    border: 1px solid var(--line); border-radius: 8px;
    padding: 10px 12px; font: inherit; outline: none; resize: vertical;
  }
  textarea:focus, input:focus { border-color: var(--accent); }
  .row { display: flex; align-items: center; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
  .row .hint { color: var(--muted); font-size: 12px; flex: 1; }
  button {
    font: inherit; cursor: pointer; border-radius: 8px; padding: 8px 16px;
    border: 1px solid var(--line); background: #1e222b; color: var(--text);
  }
  button:hover { border-color: #3a4250; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; margin-left: auto; }
  button.primary:hover { background: #4a7bf0; }
  .seg { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg button { border: 0; border-radius: 0; padding: 8px 14px; background: #10131a; color: var(--muted); }
  .seg button.on { background: #24304d; color: #fff; }
  .badge { font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; flex: none; }
  .preview { display: none; gap: 14px; align-items: center; }
  .preview img { width: 160px; height: 90px; object-fit: cover; border-radius: 8px; background: #0b0e13; flex: none; }
  .pv-info { flex: 1; min-width: 0; }
  .pv-title { font-size: 15px; margin-bottom: 6px; overflow: hidden; display: -webkit-box;
              -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .pv-meta { display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: 12px; }
  .pv-meta button { padding: 4px 12px; font-size: 12px; }
  .pv-src { display: none; align-items: center; gap: 8px; margin-top: 4px; }
  .pv-src a { color: var(--accent); font-size: 12px; overflow: hidden; text-overflow: ellipsis;
              white-space: nowrap; flex: 1; min-width: 0; text-decoration: none; }
  .pv-src a:hover { text-decoration: underline; }
  .pv-src button { padding: 2px 8px; font-size: 11px; margin: 0; }
  .pv-frame { display: flex; align-items: center; gap: 8px; margin-top: 6px; font-size: 12px; color: var(--muted); }
  .pv-frame input { width: 118px; padding: 4px 8px; font-size: 12px; }
  .pv-frame button { padding: 3px 10px; font-size: 12px; margin: 0; }
  .thumb { width: 96px; height: 54px; object-fit: cover; border-radius: 6px;
           background: #0b0e13; flex: none; display: none; cursor: pointer; }
  .thumb.on { display: block; }
  .job-body { flex: 1; min-width: 0; }
  .job { display: flex; gap: 12px; align-items: flex-start;
         border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px;
         margin-bottom: 10px; background: #13161d; }
  .job-top { display: flex; gap: 12px; align-items: baseline; }
  .job-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .job-pct { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 12px; }
  .bar { height: 6px; background: #0b0e13; border-radius: 3px; overflow: hidden; margin: 9px 0 7px; }
  .bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .3s ease; }
  .job-meta { display: flex; gap: 10px; color: var(--muted); font-size: 12px; }
  .job-meta .job-state { flex: 1; }
  .job[data-status="done"] .bar i { background: var(--ok); }
  .job[data-status="done"] .job-name { color: #cfe9d9; }
  .job[data-status="error"] .bar i { background: var(--err); }
  .job[data-status="error"] .job-state { color: var(--err); }
  .job[data-status="queued"] .bar i { background: #46506a; }
  .empty { color: var(--muted); text-align: center; padding: 22px 0; }
  details { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin-bottom: 16px; }
  summary { cursor: pointer; color: var(--muted); }
  .field { display: flex; align-items: center; gap: 10px; margin-top: 12px; }
  .field label { width: 90px; color: var(--muted); font-size: 13px; flex: none; }
  .bm { display: inline-block; margin-top: 10px; padding: 9px 18px; border-radius: 8px; background: var(--accent);
        color: #fff; text-decoration: none; font-weight: 600; cursor: grab; }
  .muted { color: var(--muted); font-size: 12px; }
  .toast { position: fixed; left: 50%; bottom: 30px; transform: translateX(-50%);
           background: #242a36; border: 1px solid var(--line); color: var(--text);
           padding: 9px 16px; border-radius: 8px; opacity: 0; transition: opacity .25s; pointer-events: none; }
  .toast.on { opacity: 1; }
</style>
</head>
<body>
<main>
  <header>
    <div class="brand"><span class="dot"></span> yt-downloader <small id="portHint"></small></div>
    <div>
      <button id="openDir">打开文件夹</button>
      <button id="quit">退出</button>
    </div>
  </header>

  <section class="card">
    <textarea id="urls" rows="2" placeholder="粘贴视频链接，多个链接可用空格或换行分隔"></textarea>
    <div class="row">
      <div class="seg" id="seg">
        <button data-mode="video" class="on">视频</button>
        <button data-mode="audio">仅音频</button>
      </div>
      <button id="clip">读取剪贴板</button>
      <span class="hint" id="cfgHint"></span>
      <button id="add" class="primary">开始下载</button>
    </div>
  </section>

  <section class="card preview" id="preview">
    <img id="pvImg" alt="">
    <div class="pv-info">
      <div class="pv-title" id="pvTitle"></div>
      <div class="pv-meta"><span id="pvMeta"></span><button id="pvSave">下载封面</button></div>
      <div class="pv-src" id="pvSrc"><a id="pvLink" target="_blank" rel="noreferrer"></a><button id="pvCopy">复制链接</button></div>
      <div class="pv-frame">
        <span>截帧</span>
        <input id="frameTime" placeholder="00:01:23 或 83" spellcheck="false">
        <button id="frameBtn">截取画面</button>
      </div>
    </div>
  </section>

  <div id="jobs"><div class="empty" id="empty">还没有下载任务</div></div>

  <div class="row" style="margin: 6px 0 18px">
    <button id="clear">清空已结束</button>
  </div>

  <details>
    <summary>设置</summary>
    <div class="field"><label>代理</label><input id="cfgProxy" placeholder="留空则直连"></div>
    <div class="field"><label>保存目录</label><input id="cfgOutdir"></div>
    <div class="field"><label>格式</label><input id="cfgFormat"></div>
    <div class="row"><button id="saveCfg" class="primary">保存</button></div>
  </details>

  <details>
    <summary>浏览器一键下载（书签）</summary>
    <p class="muted">把下面的按钮拖到浏览器书签栏。以后在视频页点一下，就会直接加入本窗口的下载队列。</p>
    <a class="bm" id="bm">一键下载视频</a>
    <a class="bm" id="bmAudio" style="margin-left:10px">一键下载音频</a>
    <p class="muted">只有本程序在运行时书签才有效；点「退出」后书签会失效，但不会留下任何系统残留。</p>
  </details>
</main>
<div class="toast" id="toast"></div>

<script>
const $ = (id) => document.getElementById(id);
const listEl = $('jobs');
const emptyEl = $('empty');
const nodes = new Map();
const STATUS = { queued: '排队中', downloading: '下载中', done: '已完成', error: '出错' };

let toastTimer = null;
function toast(msg) {
  const el = $('toast');
  el.textContent = msg;
  el.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('on'), 2200);
}

async function api(path, body) {
  const opt = body === undefined ? {} : {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  };
  const r = await fetch(path, opt);
  return r.json();
}

// ---------- 封面预览 ----------
const thumbCache = new Map();   // url -> { title, duration, thumbnail, ... }
const thumbBusy = new Set();
const previewBox = $('preview');
let previewUrl = null;
let previewTimer = null;

function firstUrl() {
  const m = $('urls').value.match(/https?:\/\/[^\s]+/);
  return m ? m[0] : null;
}

function fmtDur(sec) {
  sec = Math.round(sec || 0);
  if (!sec) return '';
  const pad = (n) => String(n).padStart(2, '0');
  const h = Math.floor(sec / 3600);
  const m = Math.floor((sec % 3600) / 60);
  return (h ? h + ':' + pad(m) : m) + ':' + pad(sec % 60);
}

async function ensureThumb(job) {
  if (thumbCache.has(job.url) || thumbBusy.has(job.url)) return;
  thumbBusy.add(job.url);
  try {
    const d = await api('/api/preview?url=' + encodeURIComponent(job.url));
    if (d.ok) thumbCache.set(job.url, d);
  } catch (e) { /* 预览失败不影响下载 */ }
  thumbBusy.delete(job.url);
}

async function loadPreview() {
  const url = firstUrl();
  if (!url) {
    previewUrl = null;
    previewBox.style.display = 'none';
    return;
  }
  if (url === previewUrl) return;
  previewUrl = url;

  previewBox.style.display = 'flex';
  $('pvTitle').textContent = '正在解析…';
  $('pvMeta').textContent = '';
  $('pvSrc').style.display = 'none';
  $('pvImg').removeAttribute('src');

  try {
    const d = await api('/api/preview?url=' + encodeURIComponent(url));
    if (previewUrl !== url) return;
    if (!d.ok) {
      $('pvTitle').textContent = '解析失败：' + (d.error || '');
      return;
    }
    thumbCache.set(url, d);
    $('pvTitle').textContent = d.title || url;
    $('pvMeta').textContent = [fmtDur(d.duration), d.uploader,
                               d.width ? d.width + '×' + d.height : ''].filter(Boolean).join(' · ');
    $('pvImg').src = '/api/thumb?src=' + encodeURIComponent(d.thumbnail);
    $('pvLink').textContent = d.thumbnail;
    $('pvLink').href = d.thumbnail;
    $('pvSrc').style.display = 'flex';
  } catch (e) {
    $('pvTitle').textContent = '解析失败';
  }
}

function schedulePreview() {
  clearTimeout(previewTimer);
  previewTimer = setTimeout(loadPreview, 600);
}

$('urls').addEventListener('input', schedulePreview);
$('pvSave').onclick = async () => {
  if (!previewUrl) return;
  const d = await api('/api/save-thumb', { url: previewUrl });
  toast(d.ok ? '封面已保存：' + d.name : '保存失败：' + (d.error || ''));
};

$('pvCopy').onclick = () => {
  const info = previewUrl && thumbCache.get(previewUrl);
  if (!info || !info.thumbnail) return;
  navigator.clipboard.writeText(info.thumbnail)
    .then(() => toast('封面链接已复制'))
    .catch(() => toast('复制失败，可手动选中链接'));
};

function parseTime(text) {
  const parts = String(text).trim().split(':').map((p) => Number(p));
  if (!parts.length || parts.some((n) => isNaN(n) || n < 0)) return -1;
  return parts.reduce((acc, n) => acc * 60 + n, 0);
}

async function captureFrame() {
  if (!previewUrl) { toast('请先粘贴并解析视频链接'); return; }
  const ts = parseTime($('frameTime').value);
  if (ts < 0) { toast('时间格式示例：00:01:23 或 83'); return; }
  const d = await api('/api/frame', { url: previewUrl, ts: ts });
  toast(d.ok ? '已加入截帧任务' : '提交失败：' + (d.error || ''));
}

$('frameBtn').onclick = captureFrame;
$('frameTime').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') captureFrame();
});

function makeCard() {
  const el = document.createElement('div');
  el.className = 'job';
  el.innerHTML =
    '<img class="thumb" alt="" title="点击下载封面">' +
    '<div class="job-body">' +
      '<div class="job-top"><span class="badge"></span><span class="job-name"></span><span class="job-pct"></span></div>' +
      '<div class="bar"><i></i></div>' +
      '<div class="job-meta"><span class="job-state"></span><span class="job-speed"></span></div>' +
    '</div>';
  el.querySelector('.thumb').onclick = async () => {
    const job = el.__job;
    if (!job) return;
    const d = await api('/api/save-thumb', { url: job.url });
    toast(d.ok ? '封面已保存：' + d.name : '封面保存失败：' + (d.error || ''));
  };
  return el;
}

function updateCard(el, job) {
  el.dataset.status = job.status;
  el.__job = job;
  el.querySelector('.badge').textContent =
    job.mode === 'audio' ? '音频' : job.mode === 'frame' ? '截帧' : '视频';

  const img = el.querySelector('.thumb');
  const info = thumbCache.get(job.url);
  if (info && info.thumbnail) {
    if (img.dataset.src !== info.thumbnail) {
      img.dataset.src = info.thumbnail;
      img.src = '/api/thumb?src=' + encodeURIComponent(info.thumbnail);
      img.classList.add('on');
    }
  } else if (!info) {
    ensureThumb(job);
  }

  const name = el.querySelector('.job-name');
  name.textContent = job.title;
  name.title = job.url;
  el.querySelector('.job-pct').textContent =
    job.status === 'done' ? '' : Math.round(job.percent || 0) + '%';
  el.querySelector('.bar i').style.width = (job.percent || 0) + '%';
  el.querySelector('.job-state').textContent =
    (STATUS[job.status] || job.status) + (job.error ? '：' + job.error : '');
  el.querySelector('.job-speed').textContent = job.speed || '';
}

function render(jobs) {
  emptyEl.style.display = jobs.length ? 'none' : 'block';
  const frag = document.createDocumentFragment();
  for (const job of jobs) {
    let el = nodes.get(job.id);
    if (!el) { el = makeCard(); nodes.set(job.id, el); }
    updateCard(el, job);
    frag.appendChild(el);
  }
  listEl.appendChild(frag);
}

let cfgLoaded = false;
async function refresh() {
  try {
    const data = await api('/api/jobs');
    render(data.jobs);
    $('cfgHint').textContent = data.config.proxy ? '代理 ' + data.config.proxy : '直连';
    $('portHint').textContent = '127.0.0.1:' + data.port;
    if (!cfgLoaded) {
      cfgLoaded = true;
      $('cfgProxy').value = data.config.proxy || '';
      $('cfgOutdir').value = data.config.outdir || '';
      $('cfgFormat').value = data.config.format || '';
      $('bm').setAttribute('href', bookmarklet(data.port, 'video'));
      $('bmAudio').setAttribute('href', bookmarklet(data.port, 'audio'));
    }
  } catch (e) {
    /* 服务已退出时静默 */
  }
}

function bookmarklet(port, mode) {
  return "javascript:(()=>{const m=location.pathname.match(/^\\/shorts\\/([\\w-]+)/);" +
    "const u=m?'https://www.youtube.com/watch?v='+m[1]:location.href;" +
    "window.open('http://127.0.0.1:" + port + "/dl?mode=" + mode +
    "&url='+encodeURIComponent(u),'_blank','width=360,height=240')})()";
}

let mode = 'video';
document.querySelectorAll('#seg button').forEach((btn) => {
  btn.onclick = () => {
    mode = btn.dataset.mode;
    document.querySelectorAll('#seg button').forEach((b) => b.classList.toggle('on', b === btn));
  };
});

async function submit() {
  const text = $('urls').value.trim();
  if (!text) { toast('请先粘贴链接'); return; }
  const data = await api('/api/download', { urls: text, mode: mode });
  if (data.added && data.added.length) {
    $('urls').value = '';
    previewUrl = null;
    previewBox.style.display = 'none';
    refresh();
  } else {
    toast('没有识别到有效链接');
  }
}

$('add').onclick = submit;
$('urls').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) submit();
});

$('clip').onclick = async () => {
  try {
    const text = (await navigator.clipboard.readText()).trim();
    if (!text) { toast('剪贴板是空的'); return; }
    $('urls').value = text;
    $('urls').focus();
  } catch (e) {
    toast('浏览器拒绝了剪贴板访问，请手动粘贴');
  }
};

$('openDir').onclick = () => api('/api/open', {});
$('clear').onclick = async () => {
  await api('/api/clear', {});
  for (const id of [...nodes.keys()]) { nodes.get(id).remove(); nodes.delete(id); }
  refresh();
};
$('saveCfg').onclick = async () => {
  const data = await api('/api/config', {
    proxy: $('cfgProxy').value,
    outdir: $('cfgOutdir').value,
    format: $('cfgFormat').value
  });
  toast('设置已保存');
  $('cfgHint').textContent = data.config.proxy ? '代理 ' + data.config.proxy : '直连';
};
$('quit').onclick = async () => {
  await api('/api/quit', {});
  document.body.innerHTML =
    '<main><div class="card" style="text-align:center">程序已退出，可以关闭此页面。</div></main>';
};

refresh();
setInterval(refresh, 1000);
</script>
</body>
</html>
